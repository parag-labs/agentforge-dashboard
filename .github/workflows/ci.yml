name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Evaluate (reproduce metrics from real runs)
        run: pnpm eval
      - name: Build
        run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit for known vulnerabilities (high+)
        run: pnpm audit --audit-level high

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: agentforge-dashboard:ci
      - name: Smoke-test the standalone server in the image
        run: |
          docker run -d --name app -p 3000:3000 agentforge-dashboard:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ -o page.html; then break; fi
            sleep 2
          done
          docker logs app
          grep -q '<title>AgentForge Dashboard</title>' page.html
          asset=$(grep -o '/_next/static/[^"]*\.js' page.html | head -n 1)
          curl -fsS "http://localhost:3000${asset}" -o /dev/null
          echo "Served / and ${asset}"
      - name: Stop container
        if: always()
        run: docker rm -f app || true

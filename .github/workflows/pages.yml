name: Deploy demo

# Builds the dashboard as a fully static export (it runs entirely client-side on deterministic
# simulated data) and publishes it to GitHub Pages at
# https://parag-labs.github.io/agentforge-dashboard/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        run: pnpm build
        env:
          PAGES: "1"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
          # Keep public/.nojekyll in the artifact (v4+ drops dotfiles by default).
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
